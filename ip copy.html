<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body {
            background: black;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        button {
            background: black;
            color: cyan;
            border: 2px solid cyan;
            padding: 10px 20px;
            font-size: 16px;
            box-shadow: 0 0 10px cyan;
            transition: all 0.3s ease;
            cursor: pointer;
        }

        button:hover {
            box-shadow: 0 0 10px cyan, 0 0 40px cyan;
            transform: scale(1.05);
        }
        
        button:active {
            box-shadow: 0 0 5px cyan, 0 0 20px cyan;
            transform: scale(0.95);
        }

        a {
            color: cyan;
            text-decoration: none;
        }

        audio {
            display: block;
            transition: all 0.3s ease;
            resize: both;
            scrollbar-width: thin;
        }

        audio::-webkit-scrollbar {
            width: 8px;
        }

        audio::-webkit-scrollbar-track {
            background: black;
        }

        audio::-webkit-scrollbar-thumb {
            background: cyan;
        }

        audio::-webkit-scrollbar-thumb:hover {
            background: #00ffff;
        }
    </style>
        
</head>
    <body>
        <button id="ipButton" type="button">Show IP</button>

        <script>
            const ipButton = document.getElementById('ipButton');

            ipButton.addEventListener('click', async () => {
                ipButton.disabled = true;
                ipButton.textContent = 'Loading...';

                try {
                    const response = await fetch('https://api.ipify.org?format=json');
                    if (!response.ok) throw new Error('Request failed');
                    const data = await response.json();
                    ipButton.textContent = data.ip || 'IP unavailable';
                } catch {
                    ipButton.textContent = 'Unable to load IP';
                } finally {
                    ipButton.disabled = false;
                }
            });
        </script>

</html>
